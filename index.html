<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e40d8">
<title>رحلة الإنجليزية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1e40d8;--blue-d:#1632a8;--blue-l:#e6ebff;--bg:#f4f1ea;--card:#fff;--text:#161a2b;--muted:#6f7488;
  --line:#e7e3d9;--ok:#16a34a;--bad:#dc2626;--orange:#ff6a3d;--shadow:0 6px 22px rgba(22,26,43,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;line-height:1.6;overflow-x:hidden}
.pathwrap{overflow:hidden;padding:0 8px}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:14px 16px 110px}
h1{font-size:1.55rem;margin:.1em 0;font-weight:800}
h2{font-size:1.2rem;margin:.2em 0;font-weight:800}
h3{font-size:1.02rem;margin:.1em 0;font-weight:700}
.muted{color:var(--muted)}.small{font-size:.85rem}.center{text-align:center}
.eyebrow{font-size:.72rem;letter-spacing:.08em;color:var(--blue);font-weight:800;direction:ltr;text-align:right}

/* top */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.hello small{display:block;color:var(--muted);font-size:.85rem}
.hello b{font-size:1.5rem;font-weight:800}
.chips{display:flex;gap:8px}
.chip{background:rgba(255,255,255,.75);border-radius:99px;padding:6px 14px;font-weight:800;display:flex;gap:8px;align-items:center;box-shadow:var(--shadow)}
.dot{width:14px;height:14px;border-radius:50%;background:var(--blue);display:inline-block}

/* hero */
.hero{background:var(--blue);color:#fff;border-radius:26px;padding:16px;margin-bottom:18px}
.hero-top{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.hero-top .mascot{flex:none}
.hero-top .ht small{opacity:.8;font-size:.78rem;letter-spacing:.06em;display:block;direction:ltr;text-align:right}
.hero-top .ht b{font-size:1.45rem;line-height:1.25;display:block}
.hero-top .ht span{opacity:.85;font-size:.9rem;direction:ltr;display:block;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}
.dots{display:grid;grid-template-columns:repeat(15,1fr);gap:7px;margin-bottom:14px}
.dots i{aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.25)}
.dots i.on{background:#fff}.dots i.now{background:var(--orange)}
.hero-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hero-row .t b{font-size:1.1rem;display:block;line-height:1.2}
.hero-row .t span{opacity:.85;font-size:.85rem}
.cta{background:#f6f3ea;color:var(--blue);border:0;border-radius:99px;padding:13px 20px;font-weight:800;font-size:1rem;cursor:pointer;white-space:nowrap}

/* sections & cards */
.sec{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px}
.sec a,.sec button{color:var(--blue);font-weight:700;font-size:.9rem;background:none;border:0;cursor:pointer}
.card{background:var(--card);border-radius:22px;padding:14px;box-shadow:var(--shadow);margin:10px 0}
.week{display:flex;justify-content:space-between;gap:4px;background:rgba(255,255,255,.6);border-radius:22px;padding:14px 10px}
.wd{flex:1;text-align:center;font-size:.72rem;color:var(--muted)}
.wd .c{width:34px;height:34px;border-radius:50%;margin:0 auto 6px;background:#e9e5da;display:grid;place-items:center;color:#fff;font-weight:800}
.wd.done .c{background:var(--blue)}
.wd.today .c{border:2.5px solid var(--text);background:#f1eee5;color:var(--text)}
.wd.today.done .c{background:var(--blue);border-color:var(--blue);color:#fff}
.prog{display:flex;gap:14px;align-items:center;cursor:pointer}
.badge{width:68px;height:68px;border-radius:20px;background:linear-gradient(135deg,#2d4ff0,var(--blue-d));color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.25rem;flex:none}
.prog.locked{opacity:.55}.prog.locked .badge{background:#9aa3c9}
.prog .info{flex:1;min-width:0}.prog .info .s{color:var(--muted);font-size:.82rem}
.bar{height:8px;background:#ece8dd;border-radius:99px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .4s}
.tag{font-size:.75rem;padding:2px 10px;border-radius:99px;background:var(--blue-l);color:var(--blue);font-weight:700;white-space:nowrap}
.tag.ok{background:#dcfce7;color:#166534}.tag.soon{background:#eceaf6;color:#5b5a78}
.wod{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wod b{direction:ltr;display:block;font-size:1.3rem;text-align:right}
.ic{display:inline-flex;align-items:center;justify-content:center;vertical-align:-.2em;line-height:0}
.ic svg{width:1.2em;height:1.2em;display:block}
.spk{color:var(--blue)}
.ic-check svg{width:1em;height:1em}
.nav .ic svg,nav .ic svg{width:1.55rem;height:1.55rem}
.spk{background:var(--blue-l);border:0;border-radius:50%;width:44px;height:44px;font-size:1.1rem;cursor:pointer;flex:none}
.spk.mic{color:#e0482b}
.spk.sm{width:34px;height:34px;font-size:.9rem}
.soon-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.soon{background:rgba(255,255,255,.6);border-radius:20px;padding:14px;min-height:120px}
.soon .soonic{width:40px;height:40px;border-radius:12px;background:var(--blue-l);display:grid;place-items:center;font-size:1.2rem;margin-bottom:8px}

/* buttons */
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px;background:var(--blue);color:#fff;font-weight:800;font-size:1rem;cursor:pointer;text-align:center;margin-top:10px}
.btn.ok{background:var(--ok)}.btn.ghost{background:transparent;color:var(--blue);border:2px solid var(--blue)}
.btn:disabled{background:#b4bdf0;color:#fff;cursor:default}
.back{display:inline-flex;gap:6px;color:var(--blue);font-weight:700;margin-bottom:8px;cursor:pointer}

/* level header + tabs */
.lh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.lh .pill{background:rgba(255,255,255,.8);border-radius:99px;padding:6px 16px;font-weight:800;direction:ltr;box-shadow:var(--shadow)}
.tabs{display:flex;background:rgba(255,255,255,.7);border-radius:99px;padding:4px;margin:12px 0}
.tab{flex:1;text-align:center;padding:8px 4px;border-radius:99px;font-weight:700;font-size:.92rem;color:var(--muted)}
.tab.on{background:#fff;color:var(--blue);box-shadow:0 2px 8px rgba(0,0,0,.08)}

/* path */
.wk{background:var(--card);border-radius:18px;padding:12px 14px;margin:22px 0 4px;box-shadow:var(--shadow)}
.wk b{display:block}.wk .eyebrow{display:block}
.pn{display:flex;flex-direction:column;align-items:center;margin:16px 0;position:relative}
.node{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:1.35rem;font-weight:800;cursor:pointer;border:0}
.node.locked{background:#e4e0d5;color:#9a9690;cursor:not-allowed}
.node.done{background:var(--blue);color:#fff}
.node.open{background:#fff;color:var(--blue);border:3px solid var(--blue)}
.node.cur{background:none;padding:0;position:relative;width:78px;height:78px;box-shadow:0 0 0 4px #fff,0 0 0 7px var(--blue-l);border-radius:50%}
.here{position:absolute;top:-38px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:3px 12px;border-radius:10px;font-size:.8rem;font-weight:700;white-space:nowrap}
.here:after{content:"";position:absolute;bottom:-5px;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:var(--text);border-bottom:0}
.pn:has(.node.cur){margin-top:46px}
.pl{text-align:center;margin-top:6px;max-width:170px}
.pl b{display:block;font-size:.85rem}.pl span{font-size:.8rem;color:var(--muted)}
.final{background:linear-gradient(135deg,#ff6a3d,#ff3d77)}

/* day page */
.dayhead{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.dayhead .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dayhead .num{font-size:3rem;font-weight:800;color:var(--blue);line-height:1}
.say{background:var(--blue-l);border-radius:16px;padding:12px 14px;margin-top:12px}
.say small{color:var(--muted)}
.say b{display:block;direction:ltr;text-align:left;margin-top:4px}
.sech{display:flex;align-items:center;gap:8px;margin:22px 0 8px}
.sech .n{width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:.8rem;font-weight:800}
.vid{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;padding:12px;margin:10px 0;box-shadow:var(--shadow)}
.vid .vt{flex:1;min-width:0}
.vid .vn{font-weight:700}.vid .vs{color:var(--muted);font-size:.82rem}.vid .vc{color:var(--muted);font-size:.75rem;direction:ltr;text-align:right}
.play{width:54px;height:54px;border-radius:16px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:1.3rem;flex:none}
.vid.seen .play{background:var(--ok)}
.note{color:var(--muted);font-size:.82rem;margin:4px 2px}
.sent{background:var(--card);border-radius:18px;padding:12px 14px;margin:8px 0;box-shadow:var(--shadow);cursor:pointer}
.sent .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sent .en{direction:ltr;text-align:left;font-weight:700;font-size:1.05rem;flex:1}
.sent .ar{color:var(--blue);margin-top:6px;display:none}
.sent.show .ar{display:block}
.words{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.word{background:var(--card);border-radius:18px;padding:40px 10px 14px;text-align:center;cursor:pointer;position:relative;min-height:86px;box-shadow:var(--shadow)}
.word b{display:block;direction:ltr;font-size:1.02rem}
.word span{display:block;color:var(--blue);margin-top:6px;visibility:hidden;font-size:.95rem}
.word.show span{visibility:visible}
.word .spk{position:absolute;top:6px;left:6px;width:30px;height:30px;font-size:.8rem}
.word .spk .ic{display:inline-flex;visibility:visible;margin:0;color:var(--blue)}
.dock{position:sticky;bottom:78px;padding:10px 0 4px;z-index:5;background:linear-gradient(rgba(244,241,234,0),var(--bg) 40%)}
.dock .btn{margin:0;box-shadow:0 8px 24px rgba(30,64,216,.25)}

/* quiz */
.q{font-size:1.2rem;font-weight:700;margin:10px 0 14px}.q.ltr{direction:ltr;text-align:left}
.opt{display:block;width:100%;text-align:start;padding:14px;margin:9px 0;border-radius:16px;border:2px solid var(--line);background:#fff;font-size:1rem;cursor:pointer;color:var(--text)}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.right{border-color:var(--ok);background:#dcfce7;color:#14532d}
.opt.wrong{border-color:var(--bad);background:#fee2e2;color:#7f1d1d}
.big{font-size:3.4rem;text-align:center}
.tip{background:#fff6cf;color:#6b4f00;border-radius:16px;padding:12px 14px;margin:10px 0;font-size:.93rem}

/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:10;padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:480px;margin:0 auto;display:flex;justify-content:space-around;padding:8px 6px}
.nav a{flex:1;text-align:center;font-size:.76rem;color:var(--muted);font-weight:700;padding:4px}
.nav a span{display:block;font-size:1.4rem;line-height:1.2}
.nav a .ic{display:flex;justify-content:center;margin:0 auto 3px;width:auto}
.soon .tag.soon{display:inline-block;margin-top:8px;min-height:0;padding:3px 12px;border-radius:999px;background:#eceaf6}
.nav a.on{color:var(--blue)}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:11px 20px;border-radius:99px;z-index:20;font-weight:700;max-width:90vw;text-align:center}
input.txt,select.txt{width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);font-size:1rem;font-family:inherit;background:#fff}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:18px;padding:14px 6px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:1.5rem;color:var(--blue)}.stat span{font-size:.78rem;color:var(--muted)}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;margin-top:18px;font-size:.9rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.btn.sm{display:inline-block;width:auto;padding:8px 16px;margin:0;font-size:.88rem;border-radius:12px}

/* ---- خريطة المستويات (دوائر) ---- */
.top2{position:sticky;top:0;z-index:8;margin:-14px -16px 12px;padding:12px 16px;background:rgba(244,241,234,.92);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid rgba(0,0,0,.04)}
.who{display:flex;align-items:center;gap:10px}
.who small{display:block;color:var(--muted);font-size:.78rem;line-height:1.2}
.who b{font-size:1.1rem;font-weight:800;line-height:1.2}
.maphead{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 0}
.map{position:relative;margin:0 -6px}
.map svg.links{position:absolute;inset:0;width:100%;height:100%}
.map svg.links path{fill:none;stroke:#d9d5c9;stroke-width:5;stroke-dasharray:2 11;stroke-linecap:round;vector-effect:non-scaling-stroke}
.map svg.links path.on{stroke:var(--blue)}
.lv{position:absolute;transform:translateX(-50%);border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;width:170px;padding:0;color:var(--text)}
.rw{position:relative;width:108px;height:108px;display:block}
.rw .ring{position:absolute;inset:0;width:100%;height:100%}
.trk{fill:none;stroke:#e4e0d5;stroke-width:7}
.prg{fill:none;stroke:var(--blue);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .6s}
.core{position:absolute;inset:12px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.6rem;background:linear-gradient(145deg,#3d5fff,#1632a8);box-shadow:0 7px 0 #0f2488;transition:transform .08s,box-shadow .08s}
.core small{display:block;font-size:.7rem;font-weight:700;opacity:.9;margin-top:-4px}
.lv:active .core{transform:translateY(5px);box-shadow:0 2px 0 #0f2488}
.lv.locked .core{background:#dcd8cc;color:#9b968a;box-shadow:0 7px 0 #c5c0b2}
.lv.locked:active .core{box-shadow:0 2px 0 #c5c0b2}
.lv.done .core{background:linear-gradient(145deg,#ffd75e,#f4a100);box-shadow:0 7px 0 #c47f00}
.lv.done:active .core{box-shadow:0 2px 0 #c47f00}
.lv.done .prg{stroke:#f4a100}
.lv.cur .core{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.lt{margin-top:12px;text-align:center}
.lt b{display:block;font-size:1rem}
.lt small{display:block;color:var(--muted);font-size:.8rem;line-height:1.35;max-width:150px;margin:0 auto}
.lv .here{top:-34px}
.crown{position:absolute;top:-10px;right:-4px;font-size:1.3rem;z-index:2;transform:rotate(18deg)}
.chipk{font-size:.7rem;background:#fff;border-radius:99px;padding:1px 9px;font-weight:800;color:var(--muted);margin-top:4px;display:inline-block}
.ov{position:fixed;inset:0;background:rgba(10,14,30,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:480px;background:#fff;border-radius:28px 28px 0 0;padding:22px 18px calc(26px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:#ddd;margin:-10px auto 14px}
.sh-top{display:flex;gap:14px;align-items:center}
.sh-badge{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.4rem;background:linear-gradient(145deg,#3d5fff,#1632a8);box-shadow:0 5px 0 #0f2488;flex:none}
.sh-badge.gold{background:linear-gradient(145deg,#ffd75e,#f4a100);box-shadow:0 5px 0 #c47f00}
.sh-badge.lock{background:#dcd8cc;color:#9b968a;box-shadow:0 5px 0 #c5c0b2}
.sh-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:16px 0 6px}
.sh-stats div{background:var(--bg);border-radius:14px;padding:10px 4px;text-align:center}
.sh-stats b{display:block;font-size:1.15rem;color:var(--blue)}
.sh-stats span{font-size:.72rem;color:var(--muted)}

/* ---- تمرين / نطق / مراجعة ---- */
.chip2{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font-size:1rem;font-weight:700;cursor:pointer;direction:ltr;color:var(--text);font-family:inherit}
.chip2:disabled{opacity:.85;cursor:default}
.bank,.ans{display:flex;flex-wrap:wrap;gap:6px;direction:ltr;min-height:56px;padding:8px;border-radius:16px}
.ans{background:var(--bg);border:2px dashed var(--line);margin:10px 0}
.ans.ok{border-color:var(--ok);background:#dcfce7}.ans.bad{border-color:var(--bad);background:#fee2e2}
.fb{margin-top:10px;font-weight:800;min-height:1.4em}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.opt.en{direction:ltr;text-align:left}
.spkrow{background:var(--card);border-radius:18px;padding:12px 14px;margin:8px 0;box-shadow:var(--shadow)}
.spkrow .top{display:flex;align-items:center;gap:8px}
.spkrow .en{direction:ltr;text-align:left;font-weight:700;flex:1}
.res{margin-top:8px}.res:empty{margin:0}
.res .wds{direction:ltr;text-align:left;font-weight:700;font-size:1.05rem}
.res .wds .g{color:var(--ok)}.res .wds .r{color:var(--bad);text-decoration:underline}
.res .pc{font-weight:800;margin-top:4px}
.mic{background:#ffe5dc}
.rev{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.btn.sm:disabled{background:#d6d3c8;color:#8d897c}
.player{margin:-2px 0 12px}
.player .ratio{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000}
.player .ratio iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.player a{display:inline-block;margin-top:6px;color:var(--blue);font-weight:700;font-size:.85rem}
</style>
</head>
<body>
<div id="app"><noscript>فعّل JavaScript لتشغيل التطبيق.</noscript></div>
<nav class="nav"><div class="in">
  <a href="#/" data-n="home"><span>🏠</span>الرئيسية</a>
  <a href="#/explore" data-n="explore"><span>🧭</span>استكشف</a>
  <a href="#/progress" data-n="progress"><span>📊</span>تقدّمي</a>
  <a href="#/me" data-n="me"><span>👤</span>حسابي</a>
</div></nav>

<script>
/* =====================================================================
   البيانات  — عدّل هنا الكورسات والدروس والأسئلة
   yt("...") يفتح بحث يوتيوب. استبدله برابط الفيديو/القائمة المباشر متى أردت.
   ===================================================================== */
const yt = q => "https://www.youtube.com/results?search_query=" + encodeURIComponent(q);
const CHANNEL = "ZAmericanEnglish";
/* ---- روابط موثّقة من قناة zAmericanEnglish (تحققت منها من صفحات القناة نفسها) ---- */
const PL = {
  lvl1:"PLp22-4PivYmIFAnru_L7fnMhSV5YffLTZ",   // كورس شامل من الصفر - المستوى الأول (25 حلقة)
  read:"PLp22-4PivYmI4PahZ0eyFjcihT7_VAs79",   // كورس القراءة
  phon:"PLp22-4PivYmIiXGqtQMrfE_tzmqE6r7Tc",   // كورس الصوتيات
  listen:"PLp22-4PivYmKGwdQda1LVJxE1p7BZYNgJ", // كورس الاستماع
  conv:"PLp22-4PivYmKp2aC7PI7K0POsf812xLBN",   // كورس المحادثة
  gram:"PLp22-4PivYmLebd3vD0_WfIteVUlSA44G"    // القواعد وشرح الأزمنة

/* ---- اختيار أفضل صوت إنجليزي متاح في الجهاز ---- */
let _voice=null;
function pickVoice(){
  if(!("speechSynthesis" in window)) return null;
  const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
  if(!vs.length) return null;
  const score=v=>{ const n=v.name; let k=0;
    if(/natural|neural|premium|enhanced|online/i.test(n)) k+=60;
    if(/google/i.test(n)) k+=30;
    if(/siri|samantha|ava|allison|evan|nicky|zoe|aria|jenny|guy|emma|andrew|brian|daniel|serena|karen/i.test(n)) k+=25;
    if(/en[-_]US/i.test(v.lang)) k+=15; else if(/en[-_]GB/i.test(v.lang)) k+=8;
    if(/compact|espeak|robot|fred|ralph|zarvox|bad |whisper|bells|boing|trinoids/i.test(n)) k-=80;
    if(!v.localService) k+=5;
    return k; };
  return vs.sort((a,b)=>score(b)-score(a))[0];
}
if("speechSynthesis" in window){ speechSynthesis.onvoiceschanged=()=>{ _voice=pickVoice(); }; _voice=pickVoice(); }
function speakLocal(t){ if(!("speechSynthesis" in window)) return; try{ speechSynthesis.cancel(); if(!_voice) _voice=pickVoice(); const u=new SpeechSynthesisUtterance(t); u.lang=_voice?_voice.lang:"en-US"; if(_voice){ try{ u.voice=_voice; }catch(e){} } u.rate=.92; u.pitch=1; speechSynthesis.speak(u);}catch(e){} }


/* ---- صوت بشري عبر خدمة TTS على الإنترنت، مع رجوع تلقائي لصوت الجهاز ---- */
let _au=null, _tok=0, _netBad=0;
function stopSpeech(){ _tok++; try{ if(_au){ _au.pause(); _au.onended=_au.onerror=_au.onplaying=null; _au=null; } }catch(e){} try{ speechSynthesis.cancel(); }catch(e){} }
function ttsChunks(t){ const out=[]; let cur=""; (String(t).match(/[^.!?]+[.!?]*\s*/g)||[String(t)]).forEach(x=>{ if(cur && (cur+x).length>170){ out.push(cur.trim()); cur=x; } else cur+=x; }); if(cur.trim()) out.push(cur.trim()); return out; }
const ttsUrl=q=>"https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en-US&q="+encodeURIComponent(q);
const _A=new Audio(); let _unl=false;
document.addEventListener("pointerdown",()=>{ if(_unl) return; _unl=true; try{ _A.src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA="; const q=_A.play(); if(q&&q.catch) q.catch(()=>{}); }catch(e){} },{once:true,capture:true});
function playChunk(src){ return new Promise((res,rej)=>{ const a=_A; _au=a; let started=false;
  const tm=setTimeout(()=>{ if(!started) rej(new Error("timeout")); },6000);
  a.onplaying=()=>{ started=true; clearTimeout(tm); };
  a.onended=()=>{ clearTimeout(tm); res(); }; a.onerror=()=>{ clearTimeout(tm); rej(new Error("audio")); };
  a.src=src; const pr=a.play(); if(pr&&pr.catch) pr.catch(e=>{ clearTimeout(tm); rej(e); }); }); }
/* اسم ملف الصوت: تجزئة FNV-1a لنص الجملة (نفس الدالة في سكربت التوليد) */
function fnv(t){ let h=0x811c9dc5; for(let i=0;i<t.length;i++){ h^=t.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return h.toString(16).padStart(8,"0"); }
const audioUrl=t=>"audio/"+fnv(String(t).trim())+".mp3";
/* ---- ElevenLabs داخل التطبيق: المفتاح محفوظ في هاتفك فقط، والأصوات تُخزَّن في الهاتف بعد أول توليد ---- */
const EL_KEY="englishPath.el";
const elCfg=()=>{ try{ return JSON.parse(localStorage.getItem(EL_KEY)||"{}"); }catch(e){ return {}; } };
const elSave=c=>{ try{ localStorage.setItem(EL_KEY,JSON.stringify(c)); }catch(e){} };
let _db=null;
const idb=()=>_db||(_db=new Promise((res,rej)=>{ try{ const r=indexedDB.open("englishPathAudio",1); r.onupgradeneeded=()=>r.result.createObjectStore("a"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }));
async function idbGet(k){ try{ const db=await idb(); return await new Promise(res=>{ const q=db.transaction("a").objectStore("a").get(k); q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null); }); }catch(e){ return null; } }
async function idbPut(k,v){ try{ const db=await idb(); await new Promise(res=>{ const t=db.transaction("a","readwrite"); t.objectStore("a").put(v,k); t.oncomplete=res; t.onerror=res; t.onabort=res; }); }catch(e){} }
async function idbCount(){ try{ const db=await idb(); return await new Promise(res=>{ const q=db.transaction("a").objectStore("a").count(); q.onsuccess=()=>res(q.result); q.onerror=()=>res(0); }); }catch(e){ return 0; } }
async function elFetch(text){
  const c=elCfg(); if(!c.key||!c.voice) return null;
  const r=await fetch("https://api.elevenlabs.io/v1/text-to-speech/"+encodeURIComponent(c.voice)+"?output_format=mp3_44100_64",{method:"POST",headers:{"xi-api-key":c.key,"Content-Type":"application/json"},body:JSON.stringify({text,model_id:c.model||"eleven_flash_v2_5",voice_settings:{stability:.5,similarity_boost:.75}})});
  if(!r.ok){ const e=new Error("el"+r.status); e.status=r.status; throw e; }
  return await r.blob();
}
const elKey=t=>fnv((elCfg().voice||"")+"|"+String(t).trim());
async function idbClear(){ try{ const db=await idb(); await new Promise(res=>{ const t=db.transaction("a","readwrite"); t.objectStore("a").clear(); t.oncomplete=res; t.onerror=res; t.onabort=res; }); }catch(e){} }
async function elBlob(text){ text=text.trim(); const k=elKey(text); let b=await idbGet(k); if(b) return b; b=await elFetch(text); if(b) await idbPut(k,b); return b; }
function elErrText(e){ return e&&e.status===401?"مفتاح ElevenLabs غير صحيح":e&&(e.status===402||e.status===429)?"انتهى رصيد ElevenLabs أو الطلبات كثيرة":"تعذّر الاتصال بـ ElevenLabs"; }
let _elBad=0;
/* الترتيب: صوت محفوظ في الهاتف ← ملف audio/ ← ElevenLabs مباشرة ← صوت الإنترنت ← صوت الجهاز */
async function speak(t){
  stopSpeech(); const tok=_tok;
  const units=Array.isArray(t)?t:(String(t).length<=200?[String(t)]:ttsChunks(t));
  for(let i=0;i<units.length;i++){
    if(tok!==_tok) return;
    const u=units[i], k=elKey(u);
    const cached=await idbGet(k); if(tok!==_tok) return;
    if(cached){ try{ await playChunk(URL.createObjectURL(cached)); continue; }catch(e){ if(tok!==_tok) return; } }
    try{ await playChunk(audioUrl(u)); continue; }catch(e){ if(tok!==_tok) return; }
    if(elCfg().key && navigator.onLine && Date.now()-_elBad>60000){
      try{ const b=await elBlob(u); if(tok!==_tok) return; if(b){ await playChunk(URL.createObjectURL(b)); continue; } }
      catch(e){ if(tok!==_tok) return; _elBad=Date.now(); toast(elErrText(e)); }
    }
    if(navigator.onLine && Date.now()-_netBad>60000){
      try{ for(const c of ttsChunks(u)){ if(tok!==_tok) return; await playChunk(ttsUrl(c)); } continue; }
      catch(e){ if(tok!==_tok) return; _netBad=Date.now(); }
    }
    speakLocal(units.slice(i).join(" ")); return;
  }
}
/* كل نصوص التطبيق الأساسية (كلمات + جمل + عبارات الأسبوع) */
function coreSpeechTexts(){
  const set=new Set();
  LEVELS.forEach(l=>{ (l.words||[]).forEach(w=>set.add(w[0].trim()));
    for(let d=1;d<=DAYS;d++){ const g=getDay(l,d); (g.read||[]).forEach(r=>set.add(r[0].trim())); g.words.forEach(w=>set.add(w[0].trim())); if(g.wk&&g.wk.say) set.add(g.wk.say.trim()); } });
  return [...set];
}

const EMO_MAP={"🔊":"spk","🎤":"mic","🎙️":"mic","🎙":"mic","✓":"check","✔":"check","✅":"checkc","🔒":"lock","🏠":"home","🧭":"compass","📊":"chart","👤":"user","🎧":"head","📖":"book","🗂️":"cards","🗂":"cards","🗣️":"chat","🗣":"chat","💬":"chat","🧩":"bolt","▶":"play"};
const EMO_RE=new RegExp(Object.keys(EMO_MAP).sort((a,b)=>b.length-a.length).join("|"),"g");
function icSvg(n){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`; }
function iconify(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>(n.parentNode&&!/^(SCRIPT|STYLE|TEXTAREA|SVG|TITLE)$/i.test(n.parentNode.nodeName)&&(EMO_RE.lastIndex=0,EMO_RE.test(n.nodeValue)))?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT});
  const list=[]; while(w.nextNode()) list.push(w.currentNode);
  list.forEach(n=>{
    const parts=n.nodeValue.split(new RegExp("("+EMO_RE.source+")","g")); const f=document.createDocumentFragment();
    parts.forEach(t=>{ if(!t) return; if(EMO_MAP[t]){ const sp=document.createElement("span"); sp.className="ic ic-"+EMO_MAP[t]; sp.innerHTML=icSvg(EMO_MAP[t]); f.appendChild(sp);} else f.appendChild(document.createTextNode(t)); });
    n.parentNode.replaceChild(f,n);
  });
}
let _icBusy=false;
new MutationObserver(()=>{ if(_icBusy) return; _icBusy=true; try{ iconify(document.body); }finally{ _icBusy=false; } }).observe(document.documentElement,{childList:true,subtree:true,characterData:true});

  if(page==="level" && byId(id)) renderLevel(id, a||"path");

}

/* =====================================================================
   مراجعة متباعدة (Leitner)
   ===================================================================== */
const INTERVALS=[1,3,7,14,30];
const addDays=n=>{ const d=new Date(); d.setDate(d.getDate()+n); return dkey(d); };
const uniq=a=>[...new Set(a)];
function addSrs(l,d){
  getDay(l,d).words.forEach(w=>{ const k=l.id+"|"+w[0]; if(!S.srs[k]) S.srs[k]={en:w[0],ar:w[1],box:0,due:addDays(1)}; });
  save();
}
const dueList=()=>Object.keys(S.srs).filter(k=>S.srs[k].due<=dkey());
let RV=null;
function startReview(){
  const keys=shuffle(dueList()).slice(0,8);
  if(!keys.length){ toast("لا كلمات للمراجعة اليوم 🎉"); location.hash="#/"; return; }
  RV={keys,i:0,ok:0,locked:false}; drawReview();
}
function drawReview(){
  if(RV.i>=RV.keys.length){
    S.log[dkey()]=true; save();
    view.innerHTML=`<div class="card"><div class="big">${RV.ok>=RV.keys.length*0.75?"🎉":"💪"}</div><h1 class="center">${RV.ok} / ${RV.keys.length}</h1>
      <p class="center">${RV.ok===RV.keys.length?"ما شاء الله، كلها صح!":"الكلمات الخاطئة سترجع لك غدًا."}</p>
      <a class="btn ok" href="#/">الرئيسية</a>${dueList().length?`<button class="btn ghost" id="more">راجع كلمات أخرى (${dueList().length})</button>`:""}</div>`;
    const m=$("#more"); if(m) m.onclick=startReview; return;
  }
  RV.locked=false;
  const key=RV.keys[RV.i], w=S.srs[key];
  const pool=LEVELS.flatMap(l=>l.words);
  const others=uniq(shuffle(pool).map(x=>x[1]).filter(v=>v!==w.ar)).slice(0,3);
  const o=shuffle([w.ar,...others]);
  view.innerHTML=`<a class="back" href="#/">→ الرئيسية</a>
    <div class="card"><div class="muted small">مراجعة الكلمات · ${RV.i+1} من ${RV.keys.length}</div>
      <div class="bar"><i style="width:${RV.i/RV.keys.length*100}%"></i></div>
      <div class="wod" style="margin:14px 0"><b style="font-size:1.6rem">${esc(w.en)}</b><button class="spk" data-say="${esc(w.en)}" aria-label="استمع">🔊</button></div>
      <div class="muted small">ما معنى هذه الكلمة؟</div>
      ${o.map((t,k)=>`<button class="opt" data-k="${k}">${esc(t)}</button>`).join("")}
      <button class="btn" id="nx" style="display:none">${RV.i===RV.keys.length-1?"النتيجة":"التالي"}</button></div>`;
  speak(w.en);
  view.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak(b.dataset.say));
  view.querySelectorAll(".opt").forEach((b,idx)=>b.onclick=()=>{
    if(RV.locked) return; RV.locked=true;
    const ok=o[idx]===w.ar;
    view.querySelectorAll(".opt").forEach((x,j)=>{ x.disabled=true; if(o[j]===w.ar) x.classList.add("right"); else if(j===idx) x.classList.add("wrong"); });
    if(ok){ RV.ok++; w.box=Math.min(w.box+1,4); w.due=addDays(INTERVALS[w.box]); } else { w.box=0; w.due=addDays(1); }
    save(); $("#nx").style.display="block";
  });
  $("#nx").onclick=()=>{ RV.i++; drawReview(); };
}

/* =====================================================================
   تمرين اليوم
   ===================================================================== */
let EX=null;
function makeExercises(l,d){
  const g=getDay(l,d), pool=l.words, items=[];
  const opts=(w,key)=>{ const others=uniq(shuffle(pool).map(x=>x[key]).filter(v=>v!==w[key])).slice(0,3); return shuffle([w[key],...others]); };
  const mcqAr=w=>({t:"mcq",q:"ما معنى «"+w[0]+"»؟",o:opts(w,1),a:w[1],say:w[0]});
  const mcqEn=w=>({t:"mcq",q:"كيف تقول «"+w[1]+"» بالإنجليزية؟",o:opts(w,0),a:w[0],ltr:true});
  const ws=shuffle(g.words);
  items.push(mcqAr(ws[0]), mcqEn(ws[1]));
  if(g.read){
    const sents=shuffle(g.read);
    const ordS=sents.find(s=>{const n=s[0].split(" ").length; return n>=3&&n<=8;})||sents[0];
    items.push({t:"order",ar:ordS[1],tokens:ordS[0].split(" "),a:ordS[0]});
    const low=w=>/^[a-z]{2,}$/.test(w), strip=w=>w.replace(/[.,!?]$/,"");
    let fill=null;
    for(const s of sents){
      const tk=s[0].split(" "), cand=tk.map((w,i)=>({w:strip(w),i})).filter(o=>o.i>0&&low(o.w));
      if(cand.length){ fill={s,tk,c:cand[Math.floor(Math.random()*cand.length)]}; break; }
    }
    if(fill){
      const bank=uniq([...g.read.flatMap(r=>r[0].split(" ").map(strip)),...pool.map(w=>w[0])].filter(w=>low(w)&&w!==fill.c.w));
      const o=shuffle([fill.c.w,...shuffle(bank).slice(0,3)]);
      const shown=fill.tk.map((w,i)=>i===fill.c.i?"_____"+(/[.,!?]$/.test(w)?w.slice(-1):""):w).join(" ");
      items.push({t:"fill",q:shown,ar:fill.s[1],o,a:fill.c.w});
    } else items.push(mcqAr(ws[2]));
  } else items.push(mcqAr(ws[2]), mcqEn(ws[3]));
  return items;
}
function openEx(id,d){
  const i=idxOf(id);
  if(!levelUnlocked(i) || !dayUnlocked(id,d)){ location.hash="#/level/"+id; return; }
  EX={id,d,i:0,score:0,items:makeExercises(byId(id),d)}; drawEx();
}
function drawEx(){
  if(EX.i>=EX.items.length) return exResult();
  const it=EX.items[EX.i], last=EX.i===EX.items.length-1;
  const head=`<a class="back" href="#/day/${EX.id}/${EX.d}">→ اليوم ${EX.d}</a>
    <div class="card"><div class="muted small">تمرين اليوم ${EX.d} · ${EX.i+1} من ${EX.items.length}</div>
    <div class="bar"><i style="width:${EX.i/EX.items.length*100}%"></i></div>`;
  let body="";
  if(it.t==="mcq") body=`<div class="q">${esc(it.q)}</div>`+it.o.map((o,k)=>`<button class="opt ${it.ltr?"en":""}" data-k="${k}">${esc(o)}</button>`).join("");
  else if(it.t==="fill") body=`<div class="muted small">أكمل الجملة:</div><div class="q ltr">${esc(it.q)}</div><div class="muted small" style="margin:-6px 0 8px">${esc(it.ar)}</div>`+it.o.map((o,k)=>`<button class="opt en" data-k="${k}">${esc(o)}</button>`).join("");
  else body=`<div class="muted small">رتّب الجملة بالإنجليزية:</div><div class="q" style="margin-bottom:4px">${esc(it.ar)}</div><div class="ans" id="ans"></div><div class="bank" id="bank"></div><button class="btn" id="chk" disabled>تحقق</button>`;
  view.innerHTML=head+body+`<div class="fb" id="fb"></div><button class="btn" id="nx" style="display:none">${last?"النتيجة":"التالي"}</button></div>`;
  let locked=false;
  const finish=(ok,msg)=>{ locked=true; if(ok) EX.score++; const fb=$("#fb"); fb.className="fb "+(ok?"ok":"bad"); fb.textContent=msg; $("#nx").style.display="block"; };
  if(it.t==="mcq"||it.t==="fill"){
    view.querySelectorAll(".opt").forEach((b,k)=>b.onclick=()=>{
      if(locked) return;
      const ok=it.o[k]===it.a;
      view.querySelectorAll(".opt").forEach((x,j)=>{ x.disabled=true; if(it.o[j]===it.a) x.classList.add("right"); else if(j===k) x.classList.add("wrong"); });
      if(it.say) speak(it.say);
      finish(ok, ok?"صحيح! ✓":"الجواب الصحيح: "+it.a);
    });
  } else {
    let tk=it.tokens.map((w,i)=>({id:i,w})), bank, tries=0;
    do{ bank=shuffle(tk); tries++; }while(tk.length>1 && bank.map(x=>x.w).join(" ")===it.a && tries<6);
    let ans=[];
    const draw=()=>{
      $("#ans").innerHTML=ans.map(x=>`<button class="chip2" data-a="${x.id}">${esc(x.w)}</button>`).join("");
      $("#bank").innerHTML=bank.map(x=>`<button class="chip2" data-b="${x.id}">${esc(x.w)}</button>`).join("");
      $("#chk").disabled = bank.length>0 || locked;
      view.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{ if(locked) return; const x=bank.find(y=>y.id==b.dataset.b); bank=bank.filter(y=>y!==x); ans.push(x); draw(); });
      view.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{ if(locked) return; const x=ans.find(y=>y.id==b.dataset.a); ans=ans.filter(y=>y!==x); bank.push(x); draw(); });
    };
    draw();
    $("#chk").onclick=()=>{
      if(locked) return;
      const got=ans.map(x=>x.w).join(" "), ok=got===it.a;
      $("#ans").classList.add(ok?"ok":"bad"); speak(it.a);
      view.querySelectorAll(".chip2").forEach(c=>c.disabled=true); $("#chk").disabled=true;
      finish(ok, ok?"صحيح! ✓":"الصحيح: "+it.a);
    };
  }
  $("#nx").onclick=()=>{ EX.i++; drawEx(); };
}
function exResult(){
  const ok=EX.score>=3, key=EX.id+":"+EX.d;
  if(ok){ S.ex[key]=true; save(); }
  view.innerHTML=`<div class="card"><div class="big">${ok?"🎉":"💪"}</div><h1 class="center">${EX.score} / ${EX.items.length}</h1>
    <p class="center">${ok?"أحسنت! فُتح زر «أنهيت اليوم».":"تحتاج 3 إجابات صحيحة على الأقل. راجع كلمات اليوم وأعد المحاولة."}</p>
    ${ok?`<a class="btn ok" href="#/day/${EX.id}/${EX.d}">العودة لليوم ${EX.d}</a>`:`<button class="btn" id="again">🔁 أعد التمرين</button><a class="btn ghost" href="#/day/${EX.id}/${EX.d}">راجع الدرس</a>`}</div>`;
  const a=$("#again"); if(a) a.onclick=()=>openEx(EX.id,EX.d);
}

/* =====================================================================
   تدريب النطق (Web Speech API)
   ===================================================================== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const NUMW={"0":"zero","1":"one","2":"two","3":"three","4":"four","5":"five","6":"six","7":"seven","8":"eight","9":"nine","10":"ten","11":"eleven","12":"twelve","13":"thirteen","14":"fourteen","15":"fifteen","16":"sixteen","17":"seventeen","18":"eighteen","19":"nineteen","20":"twenty","30":"thirty","40":"forty","50":"fifty","60":"sixty"};
const normW=t=>t.toLowerCase().replace(/[^a-z0-9' ]/g," ").split(/\s+/).filter(Boolean).map(w=>NUMW[w]||w);
function scoreSpeech(target, alts){
  const tw=target.split(" ").map(w=>({raw:w,n:normW(w)[0]||""}));
  let best=null;
  alts.forEach(a=>{
    const set=new Set(normW(a)), marks=tw.map(x=>x.n===""||set.has(x.n)), c=marks.filter(Boolean).length;
    if(!best||c>best.c) best={c,marks,heard:a};
  });
  return {pct:Math.round(best.c/tw.length*100), marks:best.marks, tw, heard:best.heard};
}
function showSpeech(res, sc){
  const msg = sc.pct>=85?"ممتاز! نطقك واضح 👏":sc.pct>=50?"جيد، كرر الكلمات الحمراء":"حاول مرة ثانية ببطء";
  res.innerHTML=`<div class="wds">${sc.tw.map((x,i)=>`<span class="${sc.marks[i]?"g":"r"}">${esc(x.raw)}</span>`).join(" ")}</div>
    <div class="pc">${sc.pct}% · ${msg}</div><div class="note" style="direction:ltr;text-align:left">سمعتك: “${esc(sc.heard)}”</div>`;
}
function micTry(row){
  const target=row.dataset.t, res=row.querySelector(".res"), btn=row.querySelector("[data-mic]");
  if(!SR){ res.innerHTML=`<div class="note">متصفحك لا يدعم التعرّف على الصوت. جرّب Chrome على الجوال أو الكمبيوتر.</div>`; return; }
  stopSpeech();
  let got=false;
  const r=new SR(); r.lang="en-US"; r.interimResults=false; r.maxAlternatives=3;
  btn.disabled=true; res.innerHTML=`<div class="note">🎙️ تكلّم الآن...</div>`;
  r.onresult=e=>{ got=true; showSpeech(res, scoreSpeech(target, Array.from(e.results[0]).map(x=>x.transcript))); };
  r.onerror=e=>{ got=true; res.innerHTML=`<div class="note">${e.error==="not-allowed"?"اسمح للمتصفح باستخدام المايكروفون ثم أعد المحاولة.":e.error==="no-speech"?"ما سمعت شيئاً، حاول مرة ثانية.":"تعذّر التسجيل، حاول مجددًا."}</div>`; };
  r.onend=()=>{ btn.disabled=false; if(!got) res.innerHTML=`<div class="note">ما سمعت شيئاً، حاول مرة ثانية.</div>`; };
  try{ r.start(); }catch(e){ btn.disabled=false; res.innerHTML=`<div class="note">تعذّر بدء التسجيل.</div>`; }
}

/* =====================================================================
   الاختبار
   ===================================================================== */
function startQuiz(id){
  const l=byId(id);
  if(!allDaysDone(id)){ toast("أنهِ الأيام الـ 30 أولاً 🔒"); location.hash="#/level/"+id; return; }
  quiz={id,n:0,score:0,locked:false,wrong:[],qs:shuffle(l.quiz).slice(0,8).map(q=>({q:q.q,opts:shuffle(q.o.map((t,k)=>({t,ok:k===q.a})))}))};
  renderQ();
}
function renderQ(){
  const l=byId(quiz.id), c=quiz.qs[quiz.n], ltr=/^[\x00-\x7F]/.test(c.q);
  quiz.locked=false;
  view.innerHTML=`
    <a class="back" href="#/level/${l.id}">→ رجوع</a>
    <div class="card">
      <div class="muted small">الاختبار النهائي ${esc(l.tag)} · سؤال ${quiz.n+1} من ${quiz.qs.length}</div>
      <div class="bar"><i style="width:${quiz.n/quiz.qs.length*100}%"></i></div>
      <div class="q ${ltr?"ltr":""}">${esc(c.q)}</div>
      ${c.opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o.t)}</button>`).join("")}
      <button class="btn" id="nx" style="display:none">${quiz.n===quiz.qs.length-1?"النتيجة":"التالي"}</button>
    </div>`;
  view.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  $("#nx").onclick=()=>{ quiz.n++; quiz.n<quiz.qs.length?renderQ():renderResult(); };
}
function pick(k){
  if(quiz.locked) return; quiz.locked=true;
  const c=quiz.qs[quiz.n];
  view.querySelectorAll(".opt").forEach((b,i)=>{ b.disabled=true; if(c.opts[i].ok) b.classList.add("right"); else if(i===k) b.classList.add("wrong"); });
  if(c.opts[k].ok) quiz.score++; else quiz.wrong.push(c.q);
  $("#nx").style.display="block";
}
function renderResult(){
  const i=idxOf(quiz.id), l=LEVELS[i], ok=quiz.score>=l.pass, last=i===LEVELS.length-1;
  if(ok){ S.done[l.id]=Math.max(quiz.score,S.done[l.id]||0); S.log[dkey()]=true; save(); }
  view.innerHTML=`
    <div class="card">
      <div class="big">${ok?"🎉":"💪"}</div>
      <h1 class="center">${quiz.score} / ${quiz.qs.length}</h1>
      <p class="center">${ok?(last?"أنهيت كل المستويات، ما شاء الله!":"نجحت! فُتح المستوى التالي."):`تحتاج ${l.pass} إجابات صحيحة على الأقل. راجع الكلمات وحاول مجددًا.`}</p>
      ${quiz.wrong.length?`<div class="tip"><b>أخطأت في:</b><br>${quiz.wrong.map(q=>"• "+esc(q)).join("<br>")}</div>`:""}
      ${ok&&!last?`<a class="btn ok" href="#/level/${LEVELS[i+1].id}">ابدأ المستوى التالي ←</a>`:""}
      ${ok&&last?`<a class="btn ok" href="#/">الرئيسية</a>`:""}
      ${!ok?`<button class="btn" id="retry">🔁 أعد المحاولة</button><a class="btn ghost" href="#/level/${l.id}/words">راجع الكلمات</a>`:""}
    </div>`;
  const r=$("#retry"); if(r) r.onclick=()=>startQuiz(l.id);
}

/* =====================================================================
   استكشف / تقدّمي / حسابي
   ===================================================================== */
function renderExplore(){
  const list=arr=>arr.map(x=>`<div class="card"><h3>${esc(x.t)} <span class="tag">${esc(x.l)}</span></h3><p class="muted small" style="margin:6px 0 10px">${esc(x.d)}</p><a class="btn sm" href="${esc(x.u)}" target="_blank" rel="noopener">افتح</a></div>`).join("");
  view.innerHTML=`<h1>استكشف</h1><p class="muted">تعلّم بطرق متنوعة: استمع، شاهد، واستمتع.</p>
    <div class="sec"><h2>🎧 بودكاست</h2></div>${list(PODCASTS)}
    <div class="sec"><h2>🎬 كرتون وفيديو</h2></div>${list(CARTOONS)}`;
}
function renderProgress(){
  view.innerHTML=`<h1>تقدّمي</h1>
    <div class="stats"><div class="stat"><b>${streak()}</b><span>مواظبة</span></div><div class="stat"><b>${totalDays()}</b><span>أيام مكتملة</span></div><div class="stat"><b>${LEVELS.filter(l=>passed(l.id)).length}/${LEVELS.length}</b><span>مستويات</span></div></div>
    <div class="sec"><h2>المستويات</h2></div>
    ${LEVELS.map((x,i)=>progCard(x,i)).join("")}`;
  bindCommon();
}
function renderMe(){
  const c=elCfg();
  view.innerHTML=`<h1>حسابي</h1>
    <div class="sec"><h2>اسمك</h2></div>
    <input class="txt" id="nm" placeholder="اكتب اسمك" maxlength="20" value="${esc(S.name)}">
    <p class="muted small">تقدمك محفوظ في هذا المتصفح فقط.</p>

    <div class="sec"><h2>صوت ElevenLabs</h2></div>
    <div class="card" id="elbox">
      <p class="note" style="margin-top:0">للحصول على صوت بشري: الصق مفتاح API الخاص بك. يُحفظ في هاتفك فقط ولا يُرسل لأي جهة غير ElevenLabs.</p>
      <input class="txt" id="elk" type="password" placeholder="مفتاح API" autocomplete="off" value="${esc(c.key||"")}">
      <button class="btn ghost" id="elc" style="margin-top:8px">ربط واختيار صوت</button>
      <div id="elv"></div>
      <div id="elst" class="muted small" style="margin-top:8px"></div>
    </div>

    <div class="center"><button class="link" id="rs">إعادة ضبط كل التقدم</button></div>`;
  $("#nm").oninput=e=>{ S.name=e.target.value.trim(); save(); };
  $("#rs").onclick=()=>{ if(confirm("هل تريد مسح كل تقدمك والبدء من جديد؟")){ S=fresh(); save(); location.hash="#/"; route(); } };

  const st=$("#elst"), vbox=$("#elv"); let stop=false;
  const refreshSt=async()=>{ const n=await idbCount(); st.textContent=n?("أصوات محفوظة في هاتفك: "+n):""; };
  function drawVoices(list){
    const cur=elCfg().voice;
    vbox.innerHTML=`<label class="muted small" style="display:block;margin-top:10px">اختر الصوت</label>
      <select class="txt" id="elsel">${list.map(v=>`<option value="${esc(v.id)}" ${v.id===cur?"selected":""}>${esc(v.name)}${v.tag?" · "+esc(v.tag):""}</option>`).join("")}</select>
      <div style="display:flex;gap:8px;margin-top:8px"><button class="btn ghost" id="elt" style="margin:0">🔊 جرّب الصوت</button><button class="btn" id="ela" style="margin:0">حمّل كل الأصوات</button></div>
      <p class="muted small" id="elinfo"></p><div class="center"><button class="link" id="elx">مسح الأصوات المحفوظة</button></div>`;
    const sel=$("#elsel"); const saveV=()=>{ const cc=elCfg(); cc.voice=sel.value; elSave(cc); }; saveV(); sel.onchange=()=>{ saveV(); st.textContent="تم تغيير الصوت. اضغط «جرّب الصوت»."; updInfo(); };
    $("#elx").onclick=async()=>{ if(confirm("مسح كل الأصوات المحفوظة في هذا الهاتف؟")){ await idbClear(); await refreshSt(); updInfo(); st.textContent="تم المسح."; } };
    $("#elt").onclick=async()=>{ st.textContent="جاري التوليد…"; try{ const b=await elBlob("Hello! Nice to meet you. How are you today?"); await refreshSt(); if(b) await playChunk(URL.createObjectURL(b)); }catch(e){ st.textContent=elErrText(e); } };
    const texts=coreSpeechTexts();
    const updInfo=async()=>{ let miss=0,ch=0; for(const t of texts){ if(!(await idbGet(elKey(t)))){ miss++; ch+=t.length; } } $("#elinfo").textContent=miss?("ناقص "+miss+" صوتًا (≈ "+Math.ceil(ch*0.5)+" رصيد). يمكنك تركه: كل صوت يُولَّد ويُحفظ تلقائيًا عند أول استخدام."):"كل الأصوات الأساسية محفوظة في هاتفك ✓"; };
    updInfo();
    $("#ela").onclick=async()=>{
      const btn=$("#ela"); if(btn.dataset.run){ stop=true; return; }
      btn.dataset.run=1; btn.textContent="إيقاف"; stop=false; let done=0,fail=0;
      for(let i=0;i<texts.length&&!stop;i++){
        const t=texts[i]; if(await idbGet(elKey(t))){ done++; continue; }
        try{ await elBlob(t); done++; }catch(e){ if(e.status===401||e.status===402||e.status===429){ st.textContent=elErrText(e)+" — توقّف عند "+done+" من "+texts.length; fail=1; break; } }
        st.textContent="جاري التحميل: "+done+" / "+texts.length;
      }
      delete btn.dataset.run; btn.textContent="حمّل كل الأصوات"; await refreshSt();
      if(!fail) st.textContent=stop?"تم الإيقاف. المحفوظ يبقى في هاتفك.":"اكتمل التحميل ✓";
    };
  }
  async function connect(){
    const key=$("#elk").value.trim(); if(!key){ st.textContent="الصق المفتاح أولًا"; return; }
    st.textContent="جاري الاتصال…";
    try{
      const r=await fetch("https://api.elevenlabs.io/v1/voices",{headers:{"xi-api-key":key}});
      if(!r.ok){ const e=new Error("x"); e.status=r.status; throw e; }
      const j=await r.json();
      const list=(j.voices||[]).map(v=>({id:v.voice_id,name:v.name,tag:v.category==="premade"?"جاهز":(v.labels&&v.labels.accent)||v.category||"",pre:v.category==="premade"?0:1,lang:(v.labels&&(v.labels.language||""))})).sort((a,b)=>a.pre-b.pre||a.name.localeCompare(b.name));
      if(!list.length){ st.textContent="لا توجد أصوات في حسابك."; return; }
      const cc=elCfg(); cc.key=key; if(!cc.voice||!list.some(v=>v.id===cc.voice)) cc.voice=list[0].id; elSave(cc); _elBad=0;
      st.textContent="تم الربط ✓"; drawVoices(list); await refreshSt();
    }catch(e){ st.textContent=e.status===401?"المفتاح غير صحيح":"تعذّر الاتصال. تأكد من الإنترنت والمفتاح."; }
  }
  $("#elc").onclick=connect;
  if(c.key) connect(); else refreshSt();
}

route();
