name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Copy web files
        run: |
          mkdir -p www
          cp index.html www/
          if [ -d audio ]; then cp -r audio www/; fi

      - name: Add Android project
        run: npx cap add android

      - name: Add microphone permission and speech service query
        run: |
          MAN=android/app/src/main/AndroidManifest.xml
          grep -q RECORD_AUDIO "$MAN" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n    </queries>\n</manifest>#' "$MAN"
          cat "$MAN"

      - name: Sync
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: english-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
